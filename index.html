<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="작고 쓸모 있는 웹 도구 배포소">
  <title>intothelightcmd</title>
  <style>
    :root {
      --bg: #0d100e;
      --panel: #171c18;
      --panel-2: #1e251f;
      --line: #344036;
      --text: #edf2ed;
      --muted: #98a39a;
      --sage: #a7cda0;
      --amber: #dfb56d;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 12% -8%, #63875c26, transparent 35rem),
        radial-gradient(circle at 93% 6%, #b8874015, transparent 30rem),
        var(--bg);
      font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    }
    main {
      width: min(1040px, 100%);
      margin: 0 auto;
      padding: clamp(42px, 9vw, 110px) clamp(18px, 5vw, 54px) 70px;
    }
    .kicker {
      margin-bottom: 13px;
      color: var(--sage);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 9px;
      border-radius: 50%;
      background: var(--sage);
      box-shadow: 0 0 14px var(--sage);
      animation: pulse 2.4s infinite;
    }
    @keyframes pulse { 50% { opacity: .4; } }
    h1 {
      margin: 0;
      font: 500 clamp(48px, 10vw, 94px)/.92 Georgia, serif;
      letter-spacing: -.065em;
    }
    .intro {
      max-width: 570px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: clamp(54px, 9vw, 90px) 0 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .section-head h2 { margin: 0; font-size: 13px; letter-spacing: .08em; }
    .section-head span { color: var(--muted); font-size: 11px; }
    .project {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 28px;
      align-items: center;
      padding: clamp(22px, 4vw, 34px);
      border: 1px solid var(--line);
      border-radius: 21px;
      color: inherit;
      background: linear-gradient(145deg, var(--panel-2), var(--panel));
      box-shadow: 0 18px 55px #00000042;
      text-decoration: none;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .project:hover {
      transform: translateY(-3px);
      border-color: #617063;
      box-shadow: 0 24px 70px #00000066;
    }
    .tag {
      display: inline-block;
      margin-bottom: 12px;
      padding: 4px 8px;
      border: 1px solid #a7cda044;
      border-radius: 99px;
      color: var(--sage);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .1em;
    }
    .project h3 { margin: 0 0 9px; font: 500 clamp(26px, 5vw, 38px) Georgia, serif; }
    .project p { max-width: 570px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.75; }
    .open {
      display: grid;
      place-items: center;
      width: 55px;
      height: 55px;
      border-radius: 17px;
      color: #111711;
      background: var(--sage);
      font-size: 24px;
      font-weight: 900;
      transition: background .2s, transform .2s;
    }
    .project:hover .open { background: #c8e9c1; transform: translateX(3px); }
    footer { margin-top: 20px; color: #6e7970; font-size: 10px; line-height: 1.7; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f1ede4; --panel: #fffdf8; --panel-2: #f7f2e9; --line: #d5cdbf; --text: #293029; --muted: #667067; --sage: #84aa7d; }
      body { background: radial-gradient(circle at 12% -8%, #9fba9740, transparent 35rem), radial-gradient(circle at 93% 6%, #d8b67b2b, transparent 30rem), var(--bg); }
      .project { box-shadow: 0 18px 55px #463d3024; }
      .project:hover { box-shadow: 0 24px 70px #463d3038; }
    }
    @media (max-width: 620px) {
      .project { grid-template-columns: 1fr; }
      .open { width: 100%; height: 45px; border-radius: 12px; }
      .section-head { align-items: start; flex-direction: column; gap: 5px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="kicker"><span class="dot"></span>small web tools</div>
      <h1>intothelightcmd</h1>
      <p class="intro">작고 쓸모 있는 웹 도구들을 모아두는 배포소. 필요한 도구를 골라 바로 열어 쓰면 됩니다.</p>
    </header>

    <section aria-labelledby="tools-title">
      <div class="section-head">
        <h2 id="tools-title">도구 목록</h2>
        <span>현재 1개</span>
      </div>
      <a class="project" href="./reroll-rescue/">
        <div>
          <span class="tag">SILLYTAVERN</span>
          <h3>리롤 구조소</h3>
          <p>사라질 뻔한 동적 패널과 리롤 채팅을 원본 그대로 구조하고, 각자의 브라우저에 보관하는 아카이브 도구.</p>
        </div>
        <span class="open" aria-hidden="true">→</span>
      </a>
    </section>

    <footer>각 도구의 개인 데이터는 사용자의 브라우저에 저장됩니다.</footer>
  </main>
</body>
</html>
