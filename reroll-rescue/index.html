<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="SillyTavern 동적 패널과 리롤 채팅을 원본 그대로 보관하는 개인 아카이브">
  <title>리롤 구조소</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("dongpae-theme")||"dark"}catch{document.documentElement.dataset.theme="dark"}</script>
  <style>
    :root{--bg:#0d100e;--s:#161a17;--s2:#1d231e;--s3:#252d27;--line:#333d35;--text:#edf2ed;--muted:#98a39a;--dim:#68736a;--sage:#a7cda0;--amber:#dfb56d;--red:#e08a80;--r:17px}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 12% -10%,#5d825726,transparent 35rem),radial-gradient(circle at 95% 5%,#b7864113,transparent 28rem),var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif}button,input,select,textarea{font:inherit}.shell{width:min(1440px,100%);margin:auto;padding:28px clamp(16px,4vw,54px) 64px}.top{display:flex;justify-content:space-between;gap:25px;align-items:flex-start;margin-bottom:27px}.kicker{color:var(--sage);font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}.dot{display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:var(--sage);box-shadow:0 0 14px var(--sage);animation:pulse 2.4s infinite}@keyframes pulse{50%{opacity:.4}}h1{margin:0;font:500 clamp(38px,5vw,68px)/.95 Georgia,serif;letter-spacing:-.055em}.sub{max-width:670px;margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.7}.actions,.row{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:41px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:var(--s2);color:var(--text);font-size:12px;font-weight:800;cursor:pointer;transition:.18s}.btn:hover{background:var(--s3);border-color:#526054}.btn:active{transform:translateY(1px)}.btn.primary{background:var(--sage);border-color:#7c9a76;color:#111711}.btn.primary:hover{background:#c8e9c1}.btn.danger{color:#f0a39a}.btn.small{min-height:33px;padding:0 10px;font-size:11px}.btn.icon{width:41px;padding:0}.bar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;margin-bottom:15px;padding:8px;border:1px solid var(--line);border-radius:15px;background:#151a16dd}.tabs{display:flex;gap:6px}.tab{padding:10px 14px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:900;cursor:pointer}.tab.active{color:var(--text);background:var(--s3)}.count{display:inline-grid;place-items:center;min-width:24px;height:21px;margin-left:6px;padding:0 6px;border-radius:99px;background:#ffffff0c;color:var(--sage);font-size:10px}.storage{padding-right:8px;color:var(--dim);font-size:11px}.toolbar{display:grid;grid-template-columns:minmax(220px,1.7fr) repeat(3,minmax(125px,.55fr)) auto;gap:9px;margin-bottom:23px}.control{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:11px;outline:0;background:var(--s);color:var(--text)}textarea.control{padding:12px;line-height:1.55;resize:vertical}.control:focus{border-color:#769170;box-shadow:0 0 0 3px #a7cda018}.control::placeholder{color:#626d64}.search{position:relative}.search:before{content:"⌕";position:absolute;left:13px;top:9px;color:var(--dim);font-size:22px}.search input{padding-left:39px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}.card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(#1c221d,#141815);box-shadow:0 9px 28px #00000029;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#4c5a4e;box-shadow:0 18px 46px #0000004d}.panel-preview{height:280px;border-bottom:1px solid var(--line);background:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px),#101311;background-size:18px 18px}.panel-preview iframe{width:100%;height:100%;border:0}.chat-preview{position:relative;height:225px;padding:22px;overflow:hidden;border-bottom:1px solid var(--line);background:#111411;color:#cbd2cc;font:14px/1.8 Georgia,serif;white-space:pre-wrap}.chat-preview:after{content:"";position:absolute;inset:auto 0 0;height:70px;background:linear-gradient(transparent,#111411)}.card-body{padding:16px}.card-head{display:flex;gap:9px;justify-content:space-between}.card h2{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}.num{color:var(--amber);font:800 13px "Courier New",monospace;white-space:nowrap}.badges{display:flex;flex-wrap:wrap;gap:5px;min-height:22px;margin-top:10px}.badge{padding:3px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:10px;font-weight:800}.badge.chosen{color:#c8e9c1;border-color:#a7cda055}.badge.unchosen{color:#efa59d;border-color:#e08a8055}.badge.simulation{color:#b7cde0}.badge.rp{color:#ddc08e}.meta{height:18px;margin:10px 0 0;overflow:hidden;color:var(--dim);font-size:11px;text-overflow:ellipsis;white-space:nowrap}.card-actions{display:flex;gap:6px;margin-top:13px}.card-actions .btn:first-child{flex:1}.empty{grid-column:1/-1;display:grid;place-items:center;min-height:390px;padding:40px;border:1px dashed #475349;border-radius:23px;background:#14181588;text-align:center}.empty .symbol{display:grid;place-items:center;width:70px;height:70px;margin:0 auto 18px;border:1px solid var(--line);border-radius:21px;background:var(--s2);color:var(--sage);font-size:29px}.empty h2{margin:0 0 8px;font:500 27px Georgia,serif}.empty p{max-width:470px;margin:0 auto 19px;color:var(--muted);font-size:13px;line-height:1.7}dialog{width:min(1120px,calc(100vw - 28px));max-height:calc(100vh - 28px);padding:0;overflow:hidden;border:1px solid #4a574c;border-radius:21px;background:var(--s);color:var(--text);box-shadow:0 35px 100px #000a}dialog::backdrop{background:#040605c7;backdrop-filter:blur(7px)}.dialog{display:flex;flex-direction:column;max-height:calc(100vh - 30px)}.dialog-head,.dialog-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 21px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font:500 24px Georgia,serif}.dialog-scroll{overflow:auto;padding:21px}.dialog-foot{border-top:1px solid var(--line);border-bottom:0;background:#121512}.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(350px,.9fr);gap:21px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;min-width:0;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{color:#bbc4bc;font-size:11px;font-weight:800}.optional{color:var(--dim);font-weight:500}.code{min-height:305px;font:12px/1.55 "Courier New",monospace}.chat-area{min-height:400px;font:14px/1.6 Georgia,serif}.context{min-height:88px}.preview-col{position:sticky;top:0;align-self:start}.preview-label{display:flex;justify-content:space-between;margin:0 0 7px;color:#bbc4bc;font-size:11px;font-weight:800}.live-frame{width:100%;height:520px;border:1px solid var(--line);border-radius:15px;background:#101310}.hint{margin:8px 2px;color:var(--dim);font-size:10px;line-height:1.55}.number{display:flex}.number span{display:grid;place-items:center;width:38px;border:1px solid var(--line);border-right:0;border-radius:11px 0 0 11px;background:var(--s3);color:var(--amber);font:800 13px monospace}.number input{border-radius:0 11px 11px 0}.detail{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:19px}.detail-frame{width:100%;min-height:570px;border:1px solid var(--line);border-radius:15px;background:#0f120f}.side{display:flex;flex-direction:column;gap:12px}.box{padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--s2)}.box h3{margin:0 0 11px;color:var(--muted);font-size:10px;letter-spacing:.12em}.meta-list{display:grid;gap:9px;margin:0}.meta-row{display:grid;gap:2px}.meta-row dt{color:var(--dim);font-size:9px;font-weight:900}.meta-row dd{margin:0;color:#d8dfd9;font-size:11px;line-height:1.5;overflow-wrap:anywhere}details.source{margin-top:14px;border:1px solid var(--line);border-radius:13px;background:#111411}details.source summary{padding:12px 14px;color:var(--muted);font-size:11px;font-weight:800;cursor:pointer}.source-code{max-height:390px;margin:0;padding:15px;overflow:auto;border-top:1px solid var(--line);color:#b1bbb2;font:11px/1.6 "Courier New",monospace;white-space:pre-wrap;overflow-wrap:anywhere}.reader{display:grid;gap:17px}.context-box{padding:14px 16px;border-left:3px solid var(--amber);border-radius:0 10px 10px 0;background:#dfb56d12;color:#cbc1ae;font-size:12px;line-height:1.7;white-space:pre-wrap}.chat-text{color:#d8ded9;font:clamp(14px,1.35vw,16px)/1.86 Georgia,serif}.chat-text p{margin:0 0 1em}.chat-text blockquote{margin:1em 0;padding-left:14px;border-left:2px solid #526054;color:#aeb7b0}.chat-text code{padding:2px 5px;border-radius:5px;background:var(--s3);font:.86em monospace}.embedded{position:relative;padding:11px;border:1px solid var(--line);border-radius:15px;background:#0f120f}.embedded iframe{width:100%;height:470px;border:0}.rescue{position:absolute;right:18px;bottom:18px;box-shadow:0 7px 18px #0008}.toast{position:fixed;z-index:50;left:50%;bottom:27px;max-width:calc(100vw - 28px);padding:11px 16px;border:1px solid #4b594e;border-radius:11px;background:#222923;box-shadow:0 16px 50px #0008;font-size:12px;font-weight:800;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}
    @media(max-width:980px){.top{flex-direction:column}.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.toolbar>.btn{grid-column:1/-1}.editor,.detail{grid-template-columns:1fr}.preview-col{position:static}.live-frame{height:430px}.side{display:grid;grid-template-columns:1fr 1fr}}
    @media(max-width:640px){.shell{padding:19px 12px 42px}.bar{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{padding-inline:7px}.storage{display:none}.toolbar,.form-grid{grid-template-columns:1fr}.search,.toolbar>.btn,.field.full{grid-column:auto}.grid{grid-template-columns:1fr}.dialog-scroll{padding:15px}.dialog-head,.dialog-foot{padding-inline:15px}.dialog-foot{flex-direction:column-reverse;align-items:stretch}.dialog-foot .row{display:grid;grid-template-columns:1fr 1fr}.side{grid-template-columns:1fr}.top .actions .btn span{display:none}.top .actions .btn{width:41px;padding:0}}
  </style>
  <style>
    html[data-theme="light"]{--bg:#f1ede4;--s:#fffdf8;--s2:#f7f2e9;--s3:#e9e2d7;--line:#d5cdbf;--text:#293029;--muted:#667067;--dim:#8b918b;--sage:#84aa7d;--amber:#9a6a22;--red:#b65c52}
    html[data-theme="light"] body{background:radial-gradient(circle at 12% -10%,#9fba9740,transparent 35rem),radial-gradient(circle at 95% 5%,#d8b67b2b,transparent 28rem),var(--bg)}
    html[data-theme="light"] .bar{background:#fffdf8e8}
    html[data-theme="light"] .card{background:linear-gradient(#fffdf9,#f8f4ec);box-shadow:0 9px 28px #463d3020}
    html[data-theme="light"] .card:hover{border-color:#aaa08f;box-shadow:0 18px 46px #463d3033}
    html[data-theme="light"] .chat-preview{background:#f8f3ea;color:#424942}
    html[data-theme="light"] .chat-preview:after{background:linear-gradient(transparent,#f8f3ea)}
    html[data-theme="light"] .empty{background:#fffdf880;border-color:#b9af9f}
    html[data-theme="light"] dialog{border-color:#b8ae9e;box-shadow:0 35px 100px #55493655}
    html[data-theme="light"] .dialog-foot,html[data-theme="light"] details.source{background:#f6f1e8}
    html[data-theme="light"] .field label,html[data-theme="light"] .preview-label{color:#515b52}
    html[data-theme="light"] .meta-row dd,html[data-theme="light"] .chat-text{color:#343b35}
    html[data-theme="light"] .source-code{color:#505951}
    html[data-theme="light"] .context-box{color:#625746;background:#b6843513}
    html[data-theme="light"] .chat-text blockquote{color:#667067;border-color:#9aab9b}
    html[data-theme="light"] .toast{background:#3d463e;color:#fff;border-color:#59665b}
    html[data-theme="light"] .badge.chosen{color:#4f774a;border-color:#6f986966}
    html[data-theme="light"] .badge.unchosen{color:#a84f46;border-color:#b65c5266}
    html[data-theme="light"] .badge.simulation{color:#51728e}
    html[data-theme="light"] .badge.rp{color:#8b6325}
    .chat-tabs{display:flex;gap:6px;width:max-content;margin-bottom:4px;padding:5px;border:1px solid var(--line);border-radius:12px;background:var(--s2)}
    .chat-tab{min-height:34px;padding:0 13px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:11px;font-weight:900;cursor:pointer}
    .chat-tab.active{background:var(--s3);color:var(--text)}
    .translation-empty{display:grid;place-items:center;min-height:280px;padding:35px;border:1px dashed var(--line);border-radius:15px;background:var(--s2);text-align:center}
    .translation-empty h3{margin:0 0 8px;font:500 23px Georgia,serif}
    .translation-empty p{max-width:430px;margin:0 0 17px;color:var(--muted);font-size:12px;line-height:1.7}
    html[data-theme="light"] .chat-tabs,html[data-theme="light"] .translation-empty{background:#f6f1e8}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div><div class="kicker"><span class="dot"></span>rescued from the reroll void</div><h1>리롤 구조소</h1><p class="sub">리롤 속에서 사라질 뻔한 동적 패널과 채팅을 원본 그대로 구조해 두는 개인 보관소.</p></div>
      <div class="actions"><button class="btn" id="themeBtn" type="button" title="밝은 테마로 바꾸기">☀ <span>밝게</span></button><button class="btn" id="importBtn" type="button">↓ <span>백업 불러오기</span></button><button class="btn" id="exportBtn" type="button">↑ <span>전체 백업</span></button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
    </header>
    <section class="bar"><div class="tabs"><button class="tab active" data-view="panels" type="button">동패 저장함 <b class="count" id="panelCount">0</b></button><button class="tab" data-view="chats" type="button">채팅 저장함 <b class="count" id="chatCount">0</b></button></div><div class="storage">이 브라우저에 자동 저장됨 · 가끔 전체 백업 권장</div></section>
    <section class="toolbar"><label class="search"><input class="control" id="searchInput" type="search" placeholder="제목, 대사, 캐릭터, #67 검색"></label><select class="control" id="sourceFilter"><option value="all">전체 출처</option><option value="simulation">시뮬</option><option value="rp">RP</option></select><select class="control" id="statusFilter"><option value="all">전체 상태</option><option value="chosen">채택</option><option value="unchosen">미채택</option><option value="undecided">미정</option></select><select class="control" id="sortSelect"><option value="newest">최근 저장순</option><option value="oldest">오래된순</option><option value="output_desc">아웃풋 번호순</option></select><button class="btn primary" id="addBtn" type="button">＋ <span id="addText">동패 구조하기</span></button></section>
    <main class="grid" id="grid" aria-live="polite"></main>
  </div>

  <dialog id="editorDialog"><form class="dialog" id="recordForm"><header class="dialog-head"><h2 id="editorTitle">새 동패 구조하기</h2><button class="btn icon" type="button" data-close="editorDialog">✕</button></header><div class="dialog-scroll"><div class="editor"><div><input id="recordId" type="hidden"><input id="recordType" type="hidden"><input id="linkedChatId" type="hidden"><div class="form-grid">
    <div class="field full"><label>제목 <span class="optional">· 비워두면 자동 생성</span></label><input class="control" id="titleInput" placeholder="예: 네부카드네자르 선실 환경 패널"></div>
    <div class="field"><label>출처</label><select class="control" id="sourceInput"><option value="">선택 안 함</option><option value="simulation">시뮬</option><option value="rp">RP</option></select></div><div class="field"><label>채택 상태</label><select class="control" id="statusInput"><option value="undecided">미정</option><option value="chosen">채택</option><option value="unchosen">미채택</option></select></div>
    <div class="field"><label>작품·세계관 <span class="optional">· 선택</span></label><input class="control" id="worldInput" placeholder="예: 매트릭스"></div><div class="field"><label>캐릭터 <span class="optional">· 선택</span></label><input class="control" id="characterInput" placeholder="예: 네오"></div>
    <div class="field"><label>아웃풋 번호 <span class="optional">· 선택</span></label><div class="number"><span>#</span><input class="control" id="outputInput" type="number" min="0" placeholder="67"></div></div><div class="field"><label>리롤 번호 <span class="optional">· 선택</span></label><input class="control" id="rerollInput" type="number" min="1" placeholder="2"></div>
    <div class="field panel-only"><label>동패 종류 <span class="optional">· 선택</span></label><input class="control" id="artifactInput" placeholder="예: 시스템 화면, 폰, 편지"></div><div class="field panel-only"><label>태그 <span class="optional">· 쉼표로 구분</span></label><input class="control" id="tagsInput" placeholder="선실, 새벽, 환경정보"></div>
    <div class="field full"><label>장면 메모 <span class="optional">· 선택</span></label><textarea class="control context" id="memoInput" placeholder="왜 저장했는지, 어떤 장면이었는지"></textarea></div>
    <div class="field full chat-only hidden"><label>출력 방식</label><select class="control" id="outputModeInput"><option value="ko">한입한출</option><option value="en">영입영출</option></select></div>
    <div class="field full chat-only hidden"><label>직전 유저 입력·상황 <span class="optional">· 선택</span></label><textarea class="control context" id="contextInput" placeholder="이 응답 직전의 입력이나 필요한 맥락"></textarea></div>
    <div class="field full panel-only"><label>동패 소스코드</label><textarea class="control code" id="codeInput" spellcheck="false" placeholder="<div>부터 </div>까지 그대로 붙여넣기"></textarea></div>
    <div class="field full chat-only hidden"><label>채팅 아웃풋 원문</label><textarea class="control chat-area" id="contentInput" spellcheck="false" placeholder="채택하지 않은 리롤 응답을 통째로 붙여넣기"></textarea></div>
    <div class="field full translation-only hidden" id="translationField"><label>한글 번역본 <span class="optional">· 나중에 추가 가능</span></label><textarea class="control chat-area" id="translationInput" spellcheck="false" placeholder="번역 확장에서 가져온 한글 번역본을 붙여넣기"></textarea></div>
  </div></div><aside class="preview-col panel-only"><div class="preview-label"><span>실시간 동패 미리보기</span><span id="previewState">코드를 붙여넣어 주세요</span></div><iframe class="live-frame" id="livePreview" sandbox="" referrerpolicy="no-referrer"></iframe><p class="hint">CSS 애니메이션과 클릭·호버 반응도 격리된 미리보기 안에서 그대로 작동합니다.</p></aside></div></div><footer class="dialog-foot"><button class="btn danger hidden" id="editorDelete" type="button">삭제</button><div class="row"><button class="btn" type="button" data-close="editorDialog">취소</button><button class="btn primary" type="submit">저장하기</button></div></footer></form></dialog>

  <dialog id="detailDialog"><div class="dialog"><header class="dialog-head"><h2 id="detailTitle">상세 보기</h2><button class="btn icon" type="button" data-close="detailDialog">✕</button></header><div class="dialog-scroll" id="detailContent"></div><footer class="dialog-foot"><button class="btn danger" id="detailDelete" type="button">삭제</button><div class="row"><button class="btn" id="detailCopy" type="button">원본 복사</button><button class="btn primary" id="detailEdit" type="button">수정하기</button></div></footer></div></dialog>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
